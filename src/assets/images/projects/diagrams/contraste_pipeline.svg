<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img"
     aria-label="Contraste: public data, a synthetic bank and known-truth generators feed a ladder of models; the open riskvalidation battery of discrimination, calibration and stability tests runs on every rung; a policy turns each p-value into a green, amber or red light; findings, an inventory and a validation report per model form the governance layer; a static site replays the committed artifacts and computes live what a reader changes; case C22 validates the validator by measuring the size and power of every registered p-value test">
  <defs>
    <marker id="ctar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#58a6ff"/></marker>
    <style>
      text{font-family:'Segoe UI',system-ui,sans-serif;fill:#c9d1d9}
      .t{fill:#c9d1d9;font-weight:600}.a{fill:#58a6ff}.m{fill:#8b949e;font-size:11px}
      .box{fill:#161b22;stroke:#30363d;stroke-width:1}.acc{stroke:#58a6ff}.warn{fill:#d29922}
    </style>
  </defs>
  <rect width="800" height="400" fill="#0d1117"/>
  <text x="32" y="44" class="t" font-size="22">Contraste</text>
  <text x="32" y="66" class="m">Validating internal risk models the way a supervisor would · 21 cases built, C19 planned</text>

  <rect x="32" y="92" width="106" height="170" rx="10" class="box acc"/>
  <text x="44" y="114" class="a" font-size="13">SOURCES</text>
  <text x="44" y="138" class="t" font-size="12">Public data</text>
  <text x="44" y="158" class="t" font-size="12">Synthetic bank</text>
  <text x="44" y="178" class="t" font-size="12">Known-truth</text>
  <text x="44" y="194" class="t" font-size="12">generators</text>
  <text x="44" y="216" class="m">49 sources, each</text>
  <text x="44" y="230" class="m">with its licence</text>
  <text x="44" y="244" class="m">class</text>
  <path d="M138 177 H158" class="acc" fill="none" stroke-width="2" marker-end="url(#ctar)"/>

  <rect x="158" y="92" width="106" height="170" rx="10" class="box"/>
  <text x="170" y="114" class="a" font-size="13">LADDER</text>
  <text x="170" y="138" class="t" font-size="12">P0 constant PD</text>
  <text x="170" y="154" class="m">to P4 monotone</text>
  <text x="170" y="168" class="m">GBM and P5</text>
  <text x="170" y="182" class="m">TabPFN v2</text>
  <text x="170" y="204" class="m">fit on training,</text>
  <text x="170" y="218" class="m">calibrate on a</text>
  <text x="170" y="232" class="m">disjoint slice,</text>
  <text x="170" y="246" class="m">test on holdout</text>
  <path d="M264 177 H284" class="acc" fill="none" stroke-width="2" marker-end="url(#ctar)"/>

  <rect x="284" y="92" width="106" height="170" rx="10" class="box acc"/>
  <text x="296" y="114" class="a" font-size="13">BATTERY</text>
  <text x="296" y="136" class="t" font-size="12">riskvalidation</text>
  <text x="296" y="152" class="m">MIT, on PyPI</text>
  <text x="296" y="174" class="m">Discrimination</text>
  <text x="296" y="188" class="m">Calibration level</text>
  <text x="296" y="202" class="m">Calibration fit</text>
  <text x="296" y="216" class="m">Stability</text>
  <text x="296" y="238" class="m">null hypothesis</text>
  <text x="296" y="252" class="m">primary source</text>
  <path d="M390 177 H410" class="acc" fill="none" stroke-width="2" marker-end="url(#ctar)"/>

  <rect x="410" y="92" width="106" height="170" rx="10" class="box"/>
  <text x="422" y="114" class="a" font-size="13">POLICY</text>
  <text x="422" y="138" class="t" font-size="12">p-value to a</text>
  <text x="422" y="154" class="t" font-size="12">light</text>
  <circle cx="434" cy="178" r="7" fill="#3fb950"/>
  <circle cx="462" cy="178" r="7" fill="#d29922"/>
  <circle cx="490" cy="178" r="7" fill="#f85149"/>
  <text x="422" y="208" class="m">Thresholds are</text>
  <text x="422" y="222" class="m">policy: the ECB</text>
  <text x="422" y="236" class="m">sets none</text>
  <path d="M516 177 H536" class="acc" fill="none" stroke-width="2" marker-end="url(#ctar)"/>

  <rect x="536" y="92" width="106" height="170" rx="10" class="box"/>
  <text x="548" y="114" class="a" font-size="13">GOVERNANCE</text>
  <text x="548" y="138" class="t" font-size="12">Inventory</text>
  <text x="548" y="154" class="m">34 entries, tiers</text>
  <text x="548" y="176" class="t" font-size="12">Register</text>
  <text x="548" y="192" class="m">577 findings</text>
  <text x="548" y="214" class="t" font-size="12">Report</text>
  <text x="548" y="230" class="m">per model</text>
  <path d="M642 177 H662" class="acc" fill="none" stroke-width="2" marker-end="url(#ctar)"/>

  <rect x="662" y="92" width="106" height="170" rx="10" class="box acc"/>
  <text x="674" y="114" class="a" font-size="13">STATIC SITE</text>
  <text x="674" y="138" class="t" font-size="12">Replay</text>
  <text x="674" y="154" class="m">committed</text>
  <text x="674" y="168" class="m">artifacts</text>
  <text x="674" y="190" class="t" font-size="12">Live</text>
  <text x="674" y="206" class="m">what a reader</text>
  <text x="674" y="220" class="m">changes</text>
  <text x="674" y="242" class="m">English, Spanish</text>

  <path d="M310 262 V292" class="acc" fill="none" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ctar)"/>
  <path d="M364 292 V264" class="acc" fill="none" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ctar)"/>
  <rect x="284" y="292" width="232" height="52" rx="8" class="box acc" stroke-dasharray="4 3"/>
  <text x="298" y="312" class="a" font-size="13">C22 validates the validator</text>
  <text x="298" y="328" class="m">size and power of every registered</text>
  <text x="298" y="341" class="m">p-value test: 4,000 repetitions a study</text>

  <text x="32" y="372" class="m">Perturbed variants of each case carry a known truth, so the page shows what each test detects and what it misses.</text>
  <text x="32" y="388" class="m">Not a certification: a passed test is evidence, not compliance. It represents no real bank.</text>
</svg>
