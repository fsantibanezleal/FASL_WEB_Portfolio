<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img"
     aria-label="StockTwin: a feed of trucks with block-model grades is built into a run-of-mine stockpile truck by truck (route or refuse, angle of repose, dozer floor, two dump phases, Gray-Thornton segregation), producing a per-cell grade volume and reclaim state, and measured against the right bounds (variance reduction vs the 1/N layer bound, a lot ledger summing to one, and a stability gate all 22 scenarios pass)">
  <defs>
    <linearGradient id="stbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="star" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#29B6F6"/></marker>
    <style>
      text{font-family:'Segoe UI',system-ui,sans-serif;fill:#c9d1d9}
      .t{fill:#e6edf3;font-weight:600}.a{fill:#29B6F6}.m{fill:#8b949e;font-size:11px}
      .box{fill:#161b22;stroke:#30363d;stroke-width:1}.acc{stroke:#29B6F6}.warn{fill:#e0a030}
    </style>
  </defs>
  <rect width="800" height="400" fill="url(#stbg)"/>
  <text x="32" y="44" class="t" font-size="22">StockTwin</text>
  <text x="32" y="66" class="m">Run-of-mine stockpile built truck by truck · synthetic + MineLib-public data · measured against the right bounds</text>

  <rect x="32" y="92" width="150" height="150" rx="10" class="box acc"/>
  <text x="46" y="116" class="a" font-size="13">FEED</text>
  <text x="46" y="140" class="t" font-size="12">Trucks, one load</text>
  <text x="46" y="156" class="t" font-size="12">at a time</text>
  <text x="46" y="180" class="m">block-model grade</text>
  <text x="46" y="196" class="m">per deposition event</text>
  <text x="46" y="220" class="m">1 sample / 100-400 t</text>

  <path d="M182 167 H214" class="acc" fill="none" stroke-width="2" marker-end="url(#star)"/>

  <rect x="214" y="80" width="226" height="240" rx="10" class="box"/>
  <text x="230" y="104" class="a" font-size="13">BUILD (truck by truck)</text>
  <rect x="230" y="116" width="194" height="42" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="134" class="t" font-size="12">Route or REFUSE</text>
  <text x="242" y="150" class="m">a truck never stands on fresh material</text>
  <rect x="230" y="164" width="194" height="42" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="182" class="t" font-size="12">Repose + dozer floor</text>
  <text x="242" y="198" class="m">2 phases: paddock dumps, edge dumps</text>
  <rect x="230" y="212" width="194" height="42" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="230" class="t" font-size="12">Gray-Thornton sieving</text>
  <text x="242" y="246" class="m">segregation down a REAL face</text>
  <text x="230" y="278" class="a" font-size="12">Reclaim in campaigns, cut by cut</text>
  <text x="230" y="298" class="warn" font-size="11">~17% of loads refused, reported not hidden</text>

  <path d="M440 200 H472" class="acc" fill="none" stroke-width="2" marker-end="url(#star)"/>

  <rect x="472" y="92" width="150" height="150" rx="10" class="box"/>
  <text x="486" y="116" class="a" font-size="13">OUTPUT</text>
  <text x="486" y="140" class="t" font-size="12">Grade VOLUME</text>
  <text x="486" y="158" class="m">event per voxel,</text>
  <text x="486" y="174" class="m">half-metre grid</text>
  <text x="486" y="198" class="t" font-size="12">Reclaim-front state</text>
  <text x="486" y="216" class="m">per-cell lot stack</text>

  <rect x="636" y="92" width="132" height="150" rx="10" class="box acc"/>
  <text x="650" y="116" class="a" font-size="12">MEASURE</text>
  <text x="650" y="138" class="m">VRR vs the 1/N</text>
  <text x="650" y="154" class="m">layer bound</text>
  <text x="650" y="176" class="m">lot ledger sums</text>
  <text x="650" y="192" class="m">to 1 on every cut</text>
  <text x="650" y="214" class="a" font-size="11">22/22 relax to</text>
  <text x="650" y="230" class="a" font-size="11">0 over repose</text>

  <text x="32" y="356" class="m">22 scenarios / 6 axes / 22,656 placed loads, each with a kill criterion, the bake gate enforced on the artifact. Physics is the</text>
  <text x="32" y="374" class="m">separately published bedblend package. Not metal accounting, not a blending optimizer, and it emits no plant setpoint.</text>
</svg>
