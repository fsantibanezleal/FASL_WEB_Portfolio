<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img"
     aria-label="GeoLab: load a DEM/GeoTIFF/vector, run real geoprocessing tools from many WASM engines behind one interface, chain them into a reproducible pipeline, and explore layers on a map or 3D canvas, entirely client-side">
  <defs>
    <linearGradient id="glbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="glar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#29B6F6"/></marker>
    <style>
      text{font-family:'Segoe UI',system-ui,sans-serif;fill:#c9d1d9}
      .t{fill:#e6edf3;font-weight:600}.a{fill:#29B6F6}.m{fill:#8b949e;font-size:11px}
      .box{fill:#161b22;stroke:#30363d;stroke-width:1}.acc{stroke:#29B6F6}
    </style>
  </defs>
  <rect width="800" height="400" fill="url(#glbg)"/>
  <text x="32" y="44" class="t" font-size="22">GeoLab</text>
  <text x="32" y="66" class="m">Browser-native multi-engine geospatial tools · client-side WASM · your data never leaves the page</text>

  <rect x="32" y="94" width="150" height="150" rx="10" class="box acc"/>
  <text x="46" y="118" class="a" font-size="13">LOAD</text>
  <text x="46" y="142" class="t" font-size="12">DEM / GeoTIFF</text>
  <text x="46" y="160" class="t" font-size="12">vector / point cloud</text>
  <text x="46" y="184" class="m">bundled synthetic sample</text>
  <text x="46" y="200" class="m">(labelled) or your own file</text>
  <text x="46" y="224" class="m">nothing uploaded</text>

  <path d="M182 169 H214" class="acc" fill="none" stroke-width="2" marker-end="url(#glar)"/>

  <rect x="214" y="82" width="230" height="236" rx="10" class="box"/>
  <text x="230" y="106" class="a" font-size="13">ONE INTERFACE, MANY ENGINES</text>
  <rect x="230" y="118" width="198" height="46" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="136" class="t" font-size="12">geolibre-wasm (LIVE)</text>
  <text x="242" y="152" class="m">747 real WhiteboxTools / GeoLibre tools</text>
  <rect x="230" y="170" width="198" height="46" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="188" class="t" font-size="12">More engines (incremental)</text>
  <text x="242" y="204" class="m">GDAL · GEOS · Turf · H3 · ITK · OpenCV · ONNX</text>
  <rect x="230" y="222" width="198" height="46" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="240" class="t" font-size="12">Own tools</text>
  <text x="242" y="256" class="m">cross-engine compare · ONNX models</text>
  <text x="230" y="292" class="a" font-size="11">runs in a Web Worker · count = only what runs</text>

  <path d="M444 200 H476" class="acc" fill="none" stroke-width="2" marker-end="url(#glar)"/>

  <rect x="476" y="94" width="150" height="150" rx="10" class="box"/>
  <text x="490" y="118" class="a" font-size="13">PIPELINE</text>
  <text x="490" y="142" class="t" font-size="12">Visual node editor</text>
  <text x="490" y="162" class="m">chain tools into a</text>
  <text x="490" y="178" class="m">reproducible recipe (JSON)</text>
  <text x="490" y="202" class="m">save · share · re-run</text>
  <text x="490" y="224" class="a" font-size="11">provenance per tool</text>

  <path d="M626 169 H658" class="acc" fill="none" stroke-width="2" marker-end="url(#glar)"/>

  <rect x="658" y="110" width="116" height="118" rx="10" class="box acc"/>
  <text x="672" y="134" class="a" font-size="13">EXPLORE</text>
  <text x="672" y="158" class="t" font-size="12">Layers</text>
  <text x="672" y="176" class="m">map / 3D canvas</text>
  <text x="672" y="194" class="m">colormap +</text>
  <text x="672" y="210" class="m">value read-out</text>

  <text x="32" y="356" class="m">A CAOS research lab (SimLab / PINN-Lab / QLab family). Aggregates a fragmented WASM ecosystem behind one</text>
  <text x="32" y="374" class="m">tool interface with reproducible pipelines and honest provenance. Actively built out; not yet a finished app.</text>
</svg>
