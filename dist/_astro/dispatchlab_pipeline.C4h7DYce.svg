<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img"
     aria-label="DispatchLab: a discrete-event mine simulation feeding nine dispatch policies compared against a closed-form capacity oracle">
  <defs>
    <linearGradient id="dlbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#29B6F6"/></marker>
    <style>
      text{font-family:'Segoe UI',system-ui,sans-serif;fill:#c9d1d9}
      .t{fill:#e6edf3;font-weight:600}.a{fill:#29B6F6}.m{fill:#8b949e;font-size:11px}
      .box{fill:#161b22;stroke:#30363d;stroke-width:1}
      .acc{stroke:#29B6F6}
    </style>
  </defs>
  <rect width="800" height="400" fill="url(#dlbg)"/>
  <text x="32" y="46" class="t" font-size="22">DispatchLab</text>
  <text x="32" y="68" class="m">In-browser truck-to-shovel dispatch bench · deterministic discrete-event open-pit simulation · 9 policies compared</text>

  <rect x="32" y="96" width="184" height="252" rx="10" class="box acc"/>
  <text x="48" y="122" class="a" font-size="13">DES CYCLE LOG</text>
  <rect x="48" y="138" width="152" height="60" rx="7" fill="#0d1117" stroke="#30363d"/>
  <text x="60" y="160" class="t" font-size="12">minehaulsim mine</text><text x="60" y="178" class="m">seeded generator · roads + grades</text>
  <rect x="48" y="206" width="152" height="60" rx="7" fill="#0d1117" stroke="#30363d"/>
  <text x="60" y="228" class="t" font-size="12">event-driven sim</text><text x="60" y="246" class="m">rimpull kinematics · bunching</text>
  <rect x="48" y="274" width="152" height="56" rx="7" fill="#0d1117" stroke="#30363d"/>
  <text x="60" y="296" class="t" font-size="12">8 synthetic + 12 real</text><text x="60" y="314" class="m">structure-real cycle logs</text>

  <path d="M216 222 H252" class="acc" fill="none" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="258" y="104" width="268" height="112" rx="9" class="box"/>
  <text x="274" y="128" class="t" font-size="13">Policy ladder (9)</text>
  <text x="274" y="150" class="m">fixed · greedy · shortestWait</text>
  <text x="274" y="170" class="m">minTruckWait · minShovelWait</text>
  <text x="274" y="190" class="m">Hungarian joint assignment (OR)</text>
  <text x="274" y="208" class="m">common random numbers across policies</text>

  <rect x="258" y="228" width="268" height="106" rx="9" class="box acc"/>
  <text x="274" y="252" class="a" font-size="13">Learned + rollout <tspan class="m">(ONNX)</tspan></text>
  <text x="274" y="274" class="m">RWR scorer · BC-best behaviour cloning</text>
  <text x="274" y="294" class="m">distilled Monte-Carlo rollout</text>
  <text x="274" y="314" class="m">141,149 logged decisions</text>
  <text x="274" y="330" class="m">bounded rollout also runs live on demand</text>

  <path d="M526 160 H560" class="acc" fill="none" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M526 281 H560" class="acc" fill="none" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="564" y="104" width="204" height="230" rx="10" class="box acc"/>
  <text x="580" y="128" class="a" font-size="13">VS CAPACITY ORACLE</text>
  <text x="580" y="150" class="m">closed-form 1x1 upper bound</text>
  <text x="580" y="172" class="m">tonnes · match factor · queues</text>
  <text x="580" y="196" class="t" font-size="12">Mean-rank leaderboard</text>
  <text x="580" y="214" class="m">bcbest 1.50 · hungarian 2.38</text>
  <text x="580" y="238" class="m">best case: 94.9-96.0% of oracle</text>
  <text x="580" y="262" class="t" font-size="12">Published NULL result</text>
  <text x="580" y="280" class="m">rollout: 0/8 eval seeds win</text>
  <text x="580" y="300" class="m">only the &gt;= base bound holds</text>
  <text x="580" y="322" class="m">(+0.42 to +1.64% deterministic)</text>

  <text x="32" y="384" class="m">Honest: no real FMS data · learned tier is imitation, not RL · counterfactual tonnes are model estimates · static GitHub Pages</text>
</svg>
