<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img"
     aria-label="ChancaDEM: crusher geometry and feed gradation solved by a Whiten population balance, Evertsson capacity and Bond power, calibrated to real HP500 surveys">
  <defs>
    <linearGradient id="cdbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#29B6F6"/></marker>
    <style>
      text{font-family:'Segoe UI',system-ui,sans-serif;fill:#c9d1d9}
      .t{fill:#e6edf3;font-weight:600}.a{fill:#29B6F6}.m{fill:#8b949e;font-size:11px}
      .box{fill:#161b22;stroke:#30363d;stroke-width:1}
      .acc{stroke:#29B6F6}
    </style>
  </defs>
  <rect width="800" height="400" fill="url(#cdbg)"/>
  <text x="32" y="46" class="t" font-size="22">ChancaDEM</text>
  <text x="32" y="68" class="m">In-browser crusher-comminution studio · NOT DEM: a closed-form population balance solved live · 5 machine types</text>

  <rect x="32" y="96" width="184" height="252" rx="10" class="box acc"/>
  <text x="48" y="122" class="a" font-size="13">MACHINE + FEED</text>
  <rect x="48" y="138" width="152" height="60" rx="7" fill="#0d1117" stroke="#30363d"/>
  <text x="60" y="160" class="t" font-size="12">crusher geometry</text><text x="60" y="178" class="m">CSS · throw · speed · chamber</text>
  <rect x="48" y="206" width="152" height="60" rx="7" fill="#0d1117" stroke="#30363d"/>
  <text x="60" y="228" class="t" font-size="12">feed gradation</text><text x="60" y="246" class="m">28-class root-2 sieve grid</text>
  <rect x="48" y="274" width="152" height="56" rx="7" fill="#0d1117" stroke="#30363d"/>
  <text x="60" y="296" class="t" font-size="12">10 real HP500 surveys</text><text x="60" y="314" class="m">Rocha 2024 · calibration lane</text>

  <path d="M216 222 H252" class="acc" fill="none" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="258" y="104" width="268" height="112" rx="9" class="box"/>
  <text x="274" y="128" class="t" font-size="13">Physics chain (closed-form)</text>
  <text x="274" y="150" class="m">Whiten population balance, LU solve</text>
  <text x="274" y="170" class="m">JKMRC t10 + Austin appearance function</text>
  <text x="274" y="190" class="m">Evertsson flow capacity (hump)</text>
  <text x="274" y="208" class="m">Bond 1952 power · nip-angle envelope</text>

  <rect x="258" y="228" width="268" height="106" rx="9" class="box acc"/>
  <text x="274" y="252" class="a" font-size="13">Learned guard <tspan class="m">(ONNX)</tspan></text>
  <text x="274" y="274" class="m">MLP surrogate emulates the engine</text>
  <text x="274" y="294" class="m">int8 variant · sub-millisecond</text>
  <text x="274" y="314" class="m">denoising AE = OOD / extrapolation guard</text>
  <text x="274" y="330" class="m">leave-one-out ridge CV + negative controls</text>

  <path d="M526 160 H560" class="acc" fill="none" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M526 281 H560" class="acc" fill="none" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="564" y="104" width="204" height="230" rx="10" class="box acc"/>
  <text x="580" y="128" class="a" font-size="13">GRADATION / TPH / POWER</text>
  <text x="580" y="150" class="m">product PSD · P80 · throughput</text>
  <text x="580" y="172" class="m">power draw · regime detection</text>
  <text x="580" y="196" class="t" font-size="12">Calibrated real lane</text>
  <text x="580" y="214" class="m">LOO throughput MAPE 12.1%</text>
  <text x="580" y="234" class="m">beats constant 18.3% + shuffle 25.0%</text>
  <text x="580" y="258" class="t" font-size="12">Surrogate fidelity</text>
  <text x="580" y="276" class="m">R2 0.995 (P80) / 0.998 (tph)</text>
  <text x="580" y="296" class="m">to the ENGINE, not a plant</text>

  <text x="32" y="384" class="m">Honest: no DEM solve runs, 3D view is kinematic · only the secondary cone is calibrated (Minas Rio HP500, CC BY) · static Pages</text>
</svg>
