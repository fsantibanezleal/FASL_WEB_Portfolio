<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img"
     aria-label="CardioPINN: real ECGi and 4D-flow MRI data feed two offline lanes, a NumPy Tikhonov-plus-ensemble ECGi lane and a torch divergence-free PINN 4D-flow lane, baked into JSON traces a static web replays, with an honest verdict that the proposal does not beat Tikhonov but adds calibrated uncertainty">
  <defs>
    <linearGradient id="cpbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#29B6F6"/></marker>
    <style>
      text{font-family:'Segoe UI',system-ui,sans-serif;fill:#c9d1d9}
      .t{fill:#e6edf3;font-weight:600}.a{fill:#29B6F6}.m{fill:#8b949e;font-size:11px}
      .box{fill:#161b22;stroke:#30363d;stroke-width:1}
      .acc{stroke:#29B6F6}
    </style>
  </defs>
  <rect width="800" height="400" fill="url(#cpbg)"/>
  <text x="32" y="46" class="t" font-size="22">CardioPINN</text>
  <text x="32" y="68" class="m">Physics-informed cardiac inverse problems · 100% real data · the honest result is the point</text>

  <rect x="32" y="96" width="182" height="252" rx="10" class="box acc"/>
  <text x="48" y="122" class="a" font-size="13">REAL DATA</text>
  <rect x="48" y="138" width="150" height="70" rx="7" fill="#0d1117" stroke="#30363d"/>
  <text x="60" y="160" class="t" font-size="12">EDGAR ECGi</text>
  <text x="60" y="178" class="m">192 to 256 · 140 to 1321</text>
  <text x="60" y="196" class="m">4 beats · torso tank + dog</text>
  <rect x="48" y="218" width="150" height="70" rx="7" fill="#0d1117" stroke="#30363d"/>
  <text x="60" y="240" class="t" font-size="12">4D-flow MRI</text>
  <text x="60" y="258" class="m">1 aorta scan · 16 frames</text>
  <text x="60" y="276" class="m">47,902 lumen voxels</text>
  <text x="48" y="316" class="m">no synthetic ground truth;</text>
  <text x="48" y="332" class="m">failed datasets excluded</text>

  <path d="M214 173 H250" class="acc" fill="none" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M214 253 H250" class="acc" fill="none" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="256" y="104" width="270" height="96" rx="9" class="box"/>
  <text x="272" y="128" class="t" font-size="13">ECGi lane <tspan class="m">(NumPy/SciPy · NOT a PINN)</tspan></text>
  <text x="272" y="150" class="m">Tikhonov regularized least squares (classical)</text>
  <text x="272" y="168" class="m">+ graph-Laplacian prior</text>
  <text x="272" y="186" class="m">+ K=6 deep ensemble, temperature-recalibrated</text>

  <rect x="256" y="208" width="270" height="90" rx="9" class="box acc"/>
  <text x="272" y="232" class="a" font-size="13">4D-flow lane (the PINN · torch)</text>
  <text x="272" y="254" class="m">divergence-free velocity PINN (denoise)</text>
  <text x="272" y="272" class="m">pressure-Poisson from analytic autograd</text>
  <text x="272" y="290" class="m">space-time PINN for dv/dt</text>

  <rect x="256" y="306" width="270" height="42" rx="9" class="box"/>
  <text x="272" y="326" class="t" font-size="12">Validate on known-answer analytic flows</text>
  <text x="272" y="342" class="m">confirmed gate 0.066 vs 4.19 mmHg (6/6) · 3 nulls</text>

  <path d="M526 150 H560" class="acc" fill="none" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M526 253 H560" class="acc" fill="none" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M526 327 H560" class="acc" fill="none" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="564" y="104" width="204" height="244" rx="10" class="box acc"/>
  <text x="580" y="128" class="a" font-size="13">BAKE-AND-READ</text>
  <text x="580" y="150" class="m">physics computed offline into JSON</text>
  <text x="580" y="168" class="m">static web replays · no browser compute</text>
  <text x="580" y="196" class="t" font-size="12">Honest verdict</text>
  <text x="580" y="216" class="m">proposal does NOT beat Tikhonov</text>
  <text x="580" y="234" class="m">on any of 4 beats (disclosed)</text>
  <text x="580" y="258" class="a" font-size="12">real gain: calibrated UQ</text>
  <text x="580" y="276" class="m">2-sigma reliability 0.89-0.90</text>
  <text x="580" y="300" class="m">0.79 mmHg range: physiological,</text>
  <text x="580" y="318" class="m">not validated (no gold standard)</text>
  <text x="580" y="336" class="m">not clinically deployed</text>

  <text x="32" y="384" class="m">Half the product is a PINN (4D-flow); the ECGi half is regularized least squares · nulls published, not buried</text>
</svg>
