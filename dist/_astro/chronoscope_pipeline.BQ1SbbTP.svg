<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img"
     aria-label="ChronoScope: 15 time-series cases forecast by a 19-method ladder across four tiers from classical to foundation models, ranked by MASE">
  <defs>
    <linearGradient id="csbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#29B6F6"/></marker>
    <style>
      text{font-family:'Segoe UI',system-ui,sans-serif;fill:#c9d1d9}
      .t{fill:#e6edf3;font-weight:600}.a{fill:#29B6F6}.m{fill:#8b949e;font-size:11px}
      .box{fill:#161b22;stroke:#30363d;stroke-width:1}
      .acc{stroke:#29B6F6}
    </style>
  </defs>
  <rect width="800" height="400" fill="url(#csbg)"/>
  <text x="32" y="46" class="t" font-size="22">ChronoScope</text>
  <text x="32" y="68" class="m">Univariate time-series forecasting atlas · 15 cases, one 19-method ladder each, backtested by MASE</text>

  <rect x="32" y="96" width="184" height="252" rx="10" class="box acc"/>
  <text x="48" y="122" class="a" font-size="13">15 CASES</text>
  <rect x="48" y="138" width="152" height="60" rx="7" fill="#0d1117" stroke="#30363d"/>
  <text x="60" y="160" class="t" font-size="12">4 real series</text><text x="60" y="178" class="m">UCI + Monash/M4 · CC BY 4.0</text>
  <rect x="48" y="206" width="152" height="60" rx="7" fill="#0d1117" stroke="#30363d"/>
  <text x="60" y="228" class="t" font-size="12">11 synthetic</text><text x="60" y="246" class="m">seeded · + noise controls</text>
  <rect x="48" y="274" width="152" height="56" rx="7" fill="#0d1117" stroke="#30363d"/>
  <text x="60" y="296" class="t" font-size="12">licence-gated bake</text><text x="60" y="314" class="m">export guard on provenance</text>

  <path d="M216 222 H252" class="acc" fill="none" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="258" y="104" width="268" height="112" rx="9" class="box"/>
  <text x="274" y="128" class="t" font-size="13">19-method ladder, 4 tiers</text>
  <text x="274" y="150" class="m">classical/stat (8): SeasonalNaive, ETS...</text>
  <text x="274" y="170" class="m">ML (1): LightGBM</text>
  <text x="274" y="190" class="m">deep (6): NHITS, DLinear, NLinear</text>
  <text x="274" y="208" class="m">10-module statistical analysis suite</text>

  <rect x="258" y="228" width="268" height="106" rx="9" class="box acc"/>
  <text x="274" y="252" class="a" font-size="13">Foundation models (4)</text>
  <text x="274" y="274" class="m">Chronos-Bolt · Chronos-2</text>
  <text x="274" y="294" class="m">TimesFM-2.5 · TiRex-2 (WSL2/CUDA)</text>
  <text x="274" y="314" class="m">zero-shot, offline, opt-in</text>
  <text x="274" y="330" class="m">285 method-case backtests total</text>

  <path d="M526 160 H560" class="acc" fill="none" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M526 281 H560" class="acc" fill="none" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="564" y="104" width="204" height="230" rx="10" class="box acc"/>
  <text x="580" y="128" class="a" font-size="13">LEADERBOARD BY MASE</text>
  <text x="580" y="150" class="t" font-size="12">best real case (M4 hourly)</text>
  <text x="596" y="172" class="m">TiRex-2 MASE 0.476</text>
  <text x="596" y="192" class="m">Chronos-2 0.589</text>
  <text x="596" y="212" class="m">SeasonalNaive 0.641</text>
  <text x="596" y="232" class="m">TimesFM-2.5 0.729</text>
  <rect x="580" y="246" width="172" height="1" fill="#30363d"/>
  <text x="580" y="268" class="m">Pyodide live lane (numpy core)</text>
  <text x="580" y="288" class="m">bring-your-own series</text>
  <text x="580" y="308" class="m">6 ADR pages · 163 tests</text>

  <text x="32" y="384" class="m">Honest: foundation models are offline-only, not in the browser · SeasonalNaive still beats TimesFM-2.5 · one series per case · static Pages</text>
</svg>
