<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img"
     aria-label="FragmentIQ: a muckpile image delineated by Otsu and watershed, refined by a boundary CNN, fitted to a Rosin-Rammler size distribution">
  <defs>
    <linearGradient id="fqbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#29B6F6"/></marker>
    <style>
      text{font-family:'Segoe UI',system-ui,sans-serif;fill:#c9d1d9}
      .t{fill:#e6edf3;font-weight:600}.a{fill:#29B6F6}.m{fill:#8b949e;font-size:11px}
      .box{fill:#161b22;stroke:#30363d;stroke-width:1}
      .acc{stroke:#29B6F6}
    </style>
  </defs>
  <rect width="800" height="400" fill="url(#fqbg)"/>
  <text x="32" y="46" class="t" font-size="22">FragmentIQ</text>
  <text x="32" y="68" class="m">Post-blast fragmentation workbench · watershed delineation + Rosin-Rammler PSD live in the browser</text>

  <rect x="32" y="96" width="184" height="252" rx="10" class="box acc"/>
  <text x="48" y="122" class="a" font-size="13">MUCKPILE IMAGE</text>
  <rect x="48" y="138" width="152" height="60" rx="7" fill="#0d1117" stroke="#30363d"/>
  <text x="60" y="160" class="t" font-size="12">7 synthetic cases</text><text x="60" y="178" class="m">RR-sized · per-pixel truth</text>
  <rect x="48" y="206" width="152" height="60" rx="7" fill="#0d1117" stroke="#30363d"/>
  <text x="60" y="228" class="t" font-size="12">5 real photos</text><text x="60" y="246" class="m">Gole-Gohar, Iran · CC BY 4.0</text>
  <rect x="48" y="274" width="152" height="56" rx="7" fill="#0d1117" stroke="#30363d"/>
  <text x="60" y="296" class="t" font-size="12">relative-only lane</text><text x="60" y="314" class="m">no sieve truth · scale unset</text>

  <path d="M216 222 H252" class="acc" fill="none" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="258" y="104" width="268" height="112" rx="9" class="box"/>
  <text x="274" y="128" class="t" font-size="13">Classical CV chain</text>
  <text x="274" y="150" class="m">Otsu threshold + connected components</text>
  <text x="274" y="170" class="m">distance transform + marker NMS</text>
  <text x="274" y="190" class="m">watershed delineation + granulometry</text>
  <text x="274" y="208" class="m">mass-weighted PSD (d^3)</text>

  <rect x="258" y="228" width="268" height="106" rx="9" class="box acc"/>
  <text x="274" y="252" class="a" font-size="13">Learned + fit <tspan class="m">(ONNX)</tspan></text>
  <text x="274" y="274" class="m">frag-edge boundary CNN refines seams</text>
  <text x="274" y="294" class="m">P50 error 27.2% -&gt; 23.8% (n=8)</text>
  <text x="274" y="314" class="m">Rosin-Rammler least-squares fit</text>
  <text x="274" y="330" class="m">fines-bias regressor offline</text>

  <path d="M526 160 H560" class="acc" fill="none" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M526 281 H560" class="acc" fill="none" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="564" y="104" width="204" height="230" rx="10" class="box acc"/>
  <text x="580" y="128" class="a" font-size="13">SIZE DISTRIBUTION</text>
  <polyline points="580,296 600,292 620,282 642,262 664,228 688,190 712,168 740,160"
            fill="none" stroke="#29B6F6" stroke-width="2"/>
  <line x1="580" y1="296" x2="752" y2="296" stroke="#30363d"/>
  <line x1="580" y1="160" x2="580" y2="296" stroke="#30363d"/>
  <text x="580" y="322" class="m">% passing vs size · P10/P50/P80</text>
  <text x="580" y="150" class="t" font-size="12">xc · n · r2</text>
  <text x="596" y="212" class="m">boundary F1</text>
  <text x="596" y="230" class="m">0.9974</text>

  <text x="32" y="384" class="m">Honest: NOT SAM/Kuz-Ram (cited only) · over-segments 116 vs 70 true · real photos are pixel-relative, no accuracy claim · static Pages</text>
</svg>
